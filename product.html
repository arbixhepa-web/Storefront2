<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Product Management</title>

    <!-- Bootstrap: [Team Member Name] -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS: [Team Member Name] -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery: [Team Member Name] -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- HTML structure: [Team Member Name] -->
    <header>
        <div class="logo">🎮 GameZone</div>
        <p>Your Ultimate Gaming Store</p>
    </header>

    <nav>
        <a href="storefront.html">Home</a>
        <a href="storefront.html#games">Games</a>
        <a href="storefront.html#accessories">Accessories</a>
        <a href="storefront.html#about">About</a>
        <a href="signup.html">Sign Up</a>
        <a href="product.html" aria-current="page">Product Management</a>
    </nav>

    <main>
        <section class="product-management-container">
            <h1>Product Management</h1>
            <p class="intro">Create, search, and update GameZone products.</p>

            <form id="productForm">
                <div class="mb-3">
                    <label for="productId" class="form-label">Product ID *</label>
                    <input type="text" class="form-control" id="productId" name="productId" maxlength="50" required>
                </div>

                <div class="mb-3">
                    <label for="productDescription" class="form-label">Product Description *</label>
                    <input type="text" class="form-control" id="productDescription" name="productDescription" maxlength="200" required>
                </div>

                <div class="mb-3">
                    <label for="productCategory" class="form-label">Product Category *</label>
                    <select class="form-select" id="productCategory" name="productCategory" required>
                        <option value="">Select a category</option>
                        <option value="Video Games">Video Games</option>
                        <option value="Consoles">Consoles</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Controllers">Controllers</option>
                        <option value="Gaming PCs">Gaming PCs</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="productUnit" class="form-label">Product Unit of Measure *</label>
                    <select class="form-select" id="productUnit" name="productUnit" required>
                        <option value="">Select a unit</option>
                        <option value="Each">Each</option>
                        <option value="Box">Box</option>
                        <option value="Pack">Pack</option>
                        <option value="Kilogram">Kilogram</option>
                        <option value="Liter">Liter</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="productPrice" class="form-label">Product Price *</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="productPrice" name="productPrice" min="0.01" max="999999999" step="0.01" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="productWeight" class="form-label">Product Weight (optional)</label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="productWeight" name="productWeight" min="0" max="999999999" step="0.01">
                        <span class="input-group-text">kg</span>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">Submit / Update Product</button>
                    <button type="button" class="btn btn-outline-light" id="searchProduct">Search by ID</button>
                    <button type="button" class="btn btn-outline-light" id="clearForm">Clear Form</button>
                </div>
            </form>

            <!-- JSON product document: [Team Member Name] -->
            <section class="product-json-output">
                <h2>Product JSON Document</h2>
                <pre id="jsonOutput">No product submitted yet.</pre>
            </section>

            <div id="productStatus" class="product-status" role="status" aria-live="polite"></div>
        </section>
    </main>

    <!-- JavaScript validation and behavior: [Team Member Name] -->
    <!-- jQuery search and update: [Team Member Name] -->
    <script>
        $(function () {
            // Temporary in-memory data; REST API comes in a later assignment.
            const products = {};

            $("#productForm").on("submit", function (event) {
                event.preventDefault();

                if (!this.checkValidity()) {
                    this.reportValidity();
                    return;
                }

                const id = $("#productId").val().trim();
                const description = $("#productDescription").val().trim();
                const category = $("#productCategory").val();
                const unit = $("#productUnit").val();
                const priceText = $("#productPrice").val();
                const price = Number(priceText);
                const weightText = $("#productWeight").val();

                if (!id || !description || !category || !unit ||
                    priceText.trim() === "" ||
                    !Number.isFinite(price) ||
                    price <= 0 || price > 999999999) {
                    showStatus("Please enter valid values in all required fields.", false);
                    return;
                }

                let weight = null;

                if (weightText.trim() !== "") {
                    weight = Number(weightText);

                    if (!Number.isFinite(weight) ||
                        weight < 0 || weight > 999999999) {
                        showStatus("Enter a valid non-negative product weight.", false);
                        return;
                    }
                }

                const product = {
                    productId: id,
                    productDescription: description,
                    productCategory: category,
                    productUnitOfMeasure: unit,
                    productPrice: "$" + price.toFixed(2),
                    productWeight: weight
                };

                const exists = Object.prototype.hasOwnProperty.call(products, id);
                products[id] = product;

                $("#jsonOutput").text(JSON.stringify(product, null, 2));

                showStatus(
                    exists
                        ? "Product updated in this browser session."
                        : "Product created in this browser session.",
                    true
                );
            });

            $("#searchProduct").on("click", function () {
                const id = $("#productId").val().trim();

                if (!id) {
                    showStatus("Enter a product ID to search.", false);
                    $("#productId").trigger("focus");
                    return;
                }

                if (!Object.prototype.hasOwnProperty.call(products, id)) {
                    showStatus("Product not found in this browser session.", false);
                    return;
                }

                const product = products[id];

                $("#productDescription").val(product.productDescription);
                $("#productCategory").val(product.productCategory);
                $("#productUnit").val(product.productUnitOfMeasure);
                $("#productPrice").val(
                    Number(product.productPrice.replace("$", ""))
                );
                $("#productWeight").val(product.productWeight ?? "");

                $("#jsonOutput").text(JSON.stringify(product, null, 2));
                showStatus("Product loaded. Edit the fields and submit to update.", true);
            });

            $("#clearForm").on("click", function () {
                $("#productForm")[0].reset();
                $("#jsonOutput").text("No product submitted yet.");
                $("#productStatus").text("");
            });

            function showStatus(message, success) {
                $("#productStatus")
                    .text(message)
                    .css("color", success ? "#86efac" : "#fca5a5");
            }
        });
    </script>
</body>
</html>
