
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Product Management</title>

    <!-- Bootstrap: Team Member 1 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS: Team Member 1 -->
    <link rel="stylesheet" href="style.css">

    <!-- jQuery: Team Member 1 -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- HTML structure: Team Member 1 -->
    <header>
        <div class="logo">🎮 GameZone</div>
        <p>Your Ultimate Gaming Store</p>
    </header>

    <nav>
        <a href="storefront.html">Home</a>
        <a href="storefront.html#games">Games</a>
        <a href="storefront.html#accessories">Accessories</a>
        <a href="storefront.html#about">About</a>
        <a href="signup.html">Sign Up</a>
        <a href="shoppingcart.html">Shopping Cart</a>
        <a href="product.html" aria-current="page">Product Management</a>
    </nav>

    <main>
        <section class="product-management-container">
            <h1>Product Management</h1>
            <p class="intro">Create, search, and update GameZone products.</p>

            <form id="productForm">
                <div class="mb-3">
                    <label for="productId" class="form-label">Product ID *</label>
                    <input type="text" class="form-control" id="productId"
                           maxlength="50" required>
                </div>

                <div class="mb-3">
                    <label for="productDescription" class="form-label">
                        Product Description *
                    </label>
                    <input type="text" class="form-control" id="productDescription"
                           maxlength="200" required>
                </div>

                <div class="mb-3">
                    <label for="productCategory" class="form-label">
                        Product Category *
                    </label>
                    <select class="form-select" id="productCategory" required>
                        <option value="">Select a category</option>
                        <option value="Video Games">Video Games</option>
                        <option value="Consoles">Consoles</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Controllers">Controllers</option>
                        <option value="Gaming PCs">Gaming PCs</option>
                        <option value="Other">Other</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="productUnit" class="form-label">
                        Product Unit of Measure *
                    </label>
                    <select class="form-select" id="productUnit" required>
                        <option value="">Select a unit</option>
                        <option value="Each">Each</option>
                        <option value="Box">Box</option>
                        <option value="Pack">Pack</option>
                        <option value="Kilogram">Kilogram</option>
                        <option value="Liter">Liter</option>
                    </select>
                </div>

                <div class="mb-3">
                    <label for="productPrice" class="form-label">Product Price *</label>
                    <div class="input-group">
                        <span class="input-group-text">$</span>
                        <input type="number" class="form-control" id="productPrice"
                               min="0.01" max="999999999" step="0.01" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label for="productWeight" class="form-label">
                        Product Weight (optional)
                    </label>
                    <div class="input-group">
                        <input type="number" class="form-control" id="productWeight"
                               min="0" max="999999999" step="0.01">
                        <span class="input-group-text">kg</span>
                    </div>
                </div>

                <div class="d-flex flex-wrap gap-2">
                    <button type="submit" class="btn btn-primary">
                        Submit / Update Product
                    </button>
                    <button type="button" class="btn btn-outline-light" id="searchProduct">
                        Search by ID
                    </button>
                    <button type="button" class="btn btn-outline-light" id="clearForm">
                        Clear Form
                    </button>
                </div>
            </form>

            <section class="product-json-output">
                <h2>Product JSON Document</h2>
                <pre id="jsonOutput">No product submitted yet.</pre>
            </section>

            <section class="product-json-output">
                <h2>Saved Products</h2>
                <div id="savedProducts">No products saved yet.</div>
            </section>

            <div id="productStatus" class="product-status"
                 role="status" aria-live="polite"></div>
        </section>
    </main>

    <!-- JavaScript validation, storage, search, and update -->
    <script>
        $(function () {
            // Read saved products from this website's browser storage.
            function getProducts() {
                try {
                    const saved = JSON.parse(
                        localStorage.getItem("gameZoneProducts") || "[]"
                    );

                    return Array.isArray(saved) ? saved : [];
                } catch (error) {
                    return [];
                }
            }

            // Save products so they remain available after refreshing.
            function saveProducts(products) {
                localStorage.setItem(
                    "gameZoneProducts",
                    JSON.stringify(products)
                );
            }

            // Display a success or error message.
            function showStatus(message, success) {
                $("#productStatus")
                    .text(message)
                    .css("color", success ? "#86efac" : "#fca5a5");
            }

            // Display all saved products.
            function displayProducts() {
                const products = getProducts();
                const container = $("#savedProducts");
                container.empty();

                if (products.length === 0) {
                    container.text("No products saved yet.");
                    return;
                }

                const table = $("<table>").addClass(
                    "table table-dark table-striped"
                );

                const header = $("<tr>");

                ["ID", "Description", "Category", "Price", "Action"]
                    .forEach(function (heading) {
                        $("<th>").text(heading).appendTo(header);
                    });

                $("<thead>").append(header).appendTo(table);

                const body = $("<tbody>");

                products.forEach(function (product) {
                    const row = $("<tr>");

                    $("<td>").text(product.productId).appendTo(row);
                    $("<td>").text(product.productDescription).appendTo(row);
                    $("<td>").text(product.productCategory).appendTo(row);

                    $("<td>").text(
                        "$" + Number(product.productPrice).toFixed(2)
                    ).appendTo(row);

                    const editButton = $("<button>")
                        .attr("type", "button")
                        .addClass("btn btn-primary btn-sm")
                        .text("Edit")
                        .on("click", function () {
                            loadProduct(product.productId);
                        });

                    $("<td>").append(editButton).appendTo(row);
                    body.append(row);
                });

                table.append(body);
                container.append(table);
            }

            // Search for a product by ID and load it into the form.
            function loadProduct(id) {
                const products = getProducts();

                const product = products.find(function (item) {
                    return item.productId.toLowerCase() === id.toLowerCase();
                });

                if (!product) {
                    showStatus("Product not found.", false);
                    return;
                }

                $("#productId").val(product.productId);
                $("#productDescription").val(product.productDescription);
                $("#productCategory").val(product.productCategory);
                $("#productUnit").val(
                    product.productUnit || product.productUnitOfMeasure || "Each"
                );

                // Supports older records where price was saved with a dollar sign.
                const price = Number(
                    String(product.productPrice).replace("$", "")
                );

                $("#productPrice").val(price);
                $("#productWeight").val(product.productWeight ?? "");

                $("#jsonOutput").text(JSON.stringify(product, null, 2));

                showStatus("Product loaded. Edit the fields and submit to update.", true);
            }

            // Create a product or update a product with the same ID.
            $("#productForm").on("submit", function (event) {
                event.preventDefault();

                if (!this.checkValidity()) {
                    this.reportValidity();
                    return;
                }

                const id = $("#productId").val().trim();
                const description = $("#productDescription").val().trim();
                const category = $("#productCategory").val();
                const unit = $("#productUnit").val();
                const priceText = $("#productPrice").val();
                const price = Number(priceText);
                const weightText = $("#productWeight").val();

                if (
                    !id || !description || !category || !unit ||
                    priceText.trim() === "" ||
                    !Number.isFinite(price) ||
                    price <= 0 || price > 999999999
                ) {
                    showStatus("Please enter valid values in all required fields.", false);
                    return;
                }

                let weight = null;

                if (weightText.trim() !== "") {
                    weight = Number(weightText);

                    if (
                        !Number.isFinite(weight) ||
                        weight < 0 || weight > 999999999
                    ) {
                        showStatus("Enter a valid non-negative product weight.", false);
                        return;
                    }
                }

                // Keep the price numeric so the shopping cart can calculate totals.
                const product = {
                    productId: id,
                    productDescription: description,
                    productCategory: category,
                    productUnit: unit,
                    productUnitOfMeasure: unit,
                    productPrice: Number(price.toFixed(2)),
                    productWeight: weight
                };

                const products = getProducts();

                const existingIndex = products.findIndex(function (item) {
                    return item.productId.toLowerCase() === id.toLowerCase();
                });

                if (existingIndex >= 0) {
                    products[existingIndex] = product;
                    showStatus("Product updated successfully.", true);
                } else {
                    products.push(product);
                    showStatus("Product created successfully.", true);
                }

                saveProducts(products);

                $("#jsonOutput").text(JSON.stringify(product, null, 2));
                displayProducts();
            });

            // Search button.
            $("#searchProduct").on("click", function () {
                const id = $("#productId").val().trim();

                if (!id) {
                    showStatus("Enter a product ID to search.", false);
                    $("#productId").trigger("focus");
                    return;
                }

                loadProduct(id);
            });

            // Clear the form.
            $("#clearForm").on("click", function () {
                $("#productForm")[0].reset();
                $("#jsonOutput").text("No product submitted yet.");
                $("#productStatus").text("");
            });

            // Load saved products when the page opens.
            displayProducts();
        });
    </script>
</body>
</html>
