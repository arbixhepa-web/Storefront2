<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Sign Up</title>
    <!-- Bootstrap CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">🎮 GameZone</div>
        <p>Your Ultimate Gaming Store</p>
    </header>
    <!-- Navigation -->
    <nav>
        <a href="storefront.html">Home</a>
        <a href="storefront.html#games">Games</a>
        <a href="storefront.html#accessories">Accessories</a>
        <a href="storefront.html#about">About</a>
        <a href="signup.html">Sign Up</a>
    </nav>
    <!-- Main Content -->
    <main>
        <div class="signup-container">
            <div class="signup-card">
                <h2>Create Your GameZone Account</h2>
                <form>
                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            required>
                    </div>
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required>
                    </div>
                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required>
                    </div>
                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm your password"
                            required>
                    </div>
                    <!-- Sign Up Button -->
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary">
                            Create Account
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer>
        <p>&copy; 2026 GameZone. All Rights Reserved.</p>
        <p>Your Ultimate Gaming Store</p>
    </footer>
    <!-- Bootstrap JavaScript CDN -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>
</body>
</html>
