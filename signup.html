<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Sign Up</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">🎮 GameZone</div>
        <p>Your Ultimate Gaming Store</p>
    </header>
    <!-- Navigation -->
    <nav>
        <a href="storefront.html">Home</a>
        <a href="storefront.html#games">Games</a>
        <a href="storefront.html#accessories">Accessories</a>
        <a href="storefront.html#about">About</a>
        <a href="signup.html">Sign Up</a>
    </nav>
    <!-- Main Content -->
    <main>
        <div class="signup-container">
            <div class="signup-card">
                <h2>Create Your GameZone Account</h2>
                <form id="signupForm" onsubmit="return validateForm()">
                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            placeholder="Enter username"
                            onfocusout="validate(this)">
                        <small
                            id="usernameError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            placeholder="joe@test.com"
                            onfocusout="validate(this)">
                        <small
                            id="emailError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            placeholder="Enter password"
                            onfocusout="validate(this)">
                        <small
                            id="passwordError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            placeholder="Confirm password"
                            onfocusout="validate(this)">
                        <small
                            id="confirmPasswordError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button type="submit" class="btn">
                            Create Account
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <!-- Footer -->
    <footer>
        <p>
            &copy; 2026 GameZone. All Rights Reserved.
        </p>
        <p>
            Your Ultimate Gaming Store
        </p>
    </footer>
    <!-- Bootstrap JavaScript -->
    <script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
    </script>
    <!-- JavaScript Validation -->
    <script>
        /*
         * Validate individual fields
         */
        function validate(obj) {
            let value = obj.value.trim();
            let errorMessage =
                document.getElementById(obj.id + "Error");
            // Reset previous validation
            obj.style.color = "";
            errorMessage.textContent = "";
            // Check if field is empty
            if (value === "") {
                obj.style.color = "#FF0000";
                errorMessage.textContent =
                    "This field is required.";
                return false;
            }
            // Username validation
            if (obj.id === "username") {
                let usernamePattern =
                    /^[A-Za-z0-9_]+$/;
                if (!usernamePattern.test(value)) {
                    obj.style.color = "#FF0000";
                    errorMessage.textContent =
                        "Username can only contain letters, numbers, and underscores.";
                    return false;
                }
            }
            // Email validation
            if (obj.id === "email") {
                let emailPattern =
                    /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailPattern.test(value)) {
                    obj.style.color = "#FF0000";
                    errorMessage.textContent =
                        "Please enter a valid email such as joe@test.com.";
                    return false;
                }
            }
            // Password validation
            if (obj.id === "password") {
                if (value.length < 6) {
                    obj.style.color = "#FF0000";
                    errorMessage.textContent =
                        "Password must be at least 6 characters.";
                    return false;
                }
                // Check confirm password if it has already been entered
                let confirmPassword =
                    document.getElementById("confirmPassword");
                if (confirmPassword.value !== "") {
                    let confirmError =
                        document.getElementById(
                            "confirmPasswordError"
                        );
                    if (value !== confirmPassword.value) {
                        confirmPassword.style.color = "#FF0000";
                        confirmError.textContent =
                            "Passwords do not match.";
                    } else {
                        confirmPassword.style.color = "";
                        confirmError.textContent = "";
                    }
                }
            }
            // Confirm Password validation
            if (obj.id === "confirmPassword") {
                let password =
                    document.getElementById("password").value;
                if (value !== password) {
                    obj.style.color = "#FF0000";
                    errorMessage.textContent =
                        "Passwords do not match.";
                    return false;
                }
            }
            // Valid input
            obj.style.color = "";
            errorMessage.textContent = "";
            return true;
        }
        /*
         * Validate the entire form when submitted
         */
        function validateForm() {
            let fields =
                document.querySelectorAll(
                    "#signupForm input"
                );
            let formIsValid = true;
            // Validate every field
            fields.forEach(function(field) {
                if (!validate(field)) {
                    formIsValid = false;
                }
            });
            // Check passwords one more time
            let password =
                document.getElementById("password");
            let confirmPassword =
                document.getElementById("confirmPassword");
            if (password.value !== confirmPassword.value) {
                confirmPassword.style.color = "#FF0000";
                document.getElementById(
                    "confirmPasswordError"
                ).textContent =
                    "Passwords do not match.";
                formIsValid = false;
            }
            // Stop submission if anything is invalid
            if (!formIsValid) {
                alert(
                    "Please correct the highlighted fields before submitting."
                );
                return false;
            }
            // Successful validation
            alert(
                "Your GameZone account information is valid!"
            );
            return true;
        }
    </script>
</body>
</html>
