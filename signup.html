<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Sign Up</title>
    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">
    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <div class="logo">🎮 GameZone</div>
        <p>Your Ultimate Gaming Store</p>
    </header>
    <!-- Navigation -->
    <nav>
        <a href="storefront.html">Home</a>
        <a href="storefront.html#games">Games</a>
        <a href="storefront.html#accessories">Accessories</a>
        <a href="storefront.html#about">About</a>
        <a href="signup.html">Sign Up</a>
    </nav>
    <!-- Main Content -->
    <main>
        <div class="signup-container">
            <div class="signup-card">
                <h2>Create Your GameZone Account</h2>
                <!-- Sign Up Form -->
                <form id="signupForm">
                    <!-- Username -->
                    <div class="mb-3">
                        <label for="username" class="form-label">
                            Username
                        </label>
                        <input
                            type="text"
                            class="form-control"
                            id="username"
                            name="username"
                            placeholder="Enter username"
                            onfocusout="validate(this)"
                            required>
                        <small
                            id="usernameError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Email -->
                    <div class="mb-3">
                        <label for="email" class="form-label">
                            Email
                        </label>
                        <input
                            type="email"
                            class="form-control"
                            id="email"
                            name="email"
                            placeholder="joe@test.com"
                            onfocusout="validate(this)"
                            required>
                        <small
                            id="emailError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Password -->
                    <div class="mb-3">
                        <label for="password" class="form-label">
                            Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="password"
                            name="password"
                            placeholder="Enter password"
                            onfocusout="validate(this)"
                            required>
                        <small
                            id="passwordError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Confirm Password -->
                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input
                            type="password"
                            class="form-control"
                            id="confirmPassword"
                            name="confirmPassword"
                            placeholder="Confirm password"
                            onfocusout="validate(this)"
                            required>
                        <small
                            id="confirmPasswordError"
                            class="error-message">
                        </small>
                    </div>
                    <!-- Submit Button -->
                    <div class="d-grid">
                        <button
                            type="submit"
                            class="btn">
                            Create Account
                        </button>
                    </div>
                    <!-- JSON Output -->
                    <div class="mt-4">
                        <h5>Submitted Form Data</h5>
                        <pre id="jsonOutput"></pre>
                    </div>
                </form>
            </div>
        </div>
    </main>
    <!-- JavaScript -->
    <script>
        document.getElementById("signupForm").addEventListener("submit", function(event) {
            // Stop the form from refreshing the page
            event.preventDefault();
            // Get the form
            const form = event.target;
            // Create JSON object using each form field value
            const jsonObject = {
                username: form.username.value,
                email: form.email.value,
                password: form.password.value,
                confirmPassword: form.confirmPassword.value
            };
            // Display the JSON object below the submit button
            document.getElementById("jsonOutput").textContent =
                JSON.stringify(jsonObject, null, 2);
        });
    </script>
</body>
</html>
