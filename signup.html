
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GameZone - Sign Up</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- Shared GameZone stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Signup page header -->
    <header>
        <div class="logo">🎮 GameZone</div>
        <p>Your Ultimate Gaming Store</p>
    </header>

    <nav>
        <a href="storefront.html">Home</a>
        <a href="storefront.html#games">Games</a>
        <a href="storefront.html#accessories">Accessories</a>
        <a href="storefront.html#about">About</a>
        <a href="signup.html" aria-current="page">Sign Up</a>
        <a href="shoppingcart.html">Shopping Cart</a>
        <a href="product.html">Product Management</a>
    </nav>

    <main>
        <div class="signup-container">
            <div class="signup-card">
                <h2>Create Your GameZone Account</h2>

                <form id="signupForm">
                    <div class="mb-3">
                        <label for="username" class="form-label">Username</label>
                        <input type="text" class="form-control"
                               id="username" name="username"
                               maxlength="50" required>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label">Email</label>
                        <input type="email" class="form-control"
                               id="email" name="email"
                               placeholder="joe@test.com" required>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Password</label>
                        <input type="password" class="form-control"
                               id="password" name="password"
                               minlength="8" autocomplete="new-password" required>
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">
                            Confirm Password
                        </label>
                        <input type="password" class="form-control"
                               id="confirmPassword" name="confirmPassword"
                               minlength="8" autocomplete="new-password" required>
                    </div>

                    <div id="signupStatus" class="product-status"
                         role="status" aria-live="polite"></div>

                    <div class="d-grid mt-3">
                        <button type="submit" class="btn">Create Account</button>
                    </div>
                </form>

                <div class="product-json-output">
                    <h2>Submitted Form Data</h2>
                    <pre id="signupJson">No form submitted yet.</pre>
                </div>
            </div>
        </div>
    </main>

    <!-- Signup validation and JSON output -->
    <script>
        document.getElementById("signupForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const confirmPassword = document.getElementById("confirmPassword").value;
            const status = document.getElementById("signupStatus");

            if (!username || !email) {
                status.textContent = "Please complete all required fields.";
                status.style.color = "#fca5a5";
                return;
            }

            if (password.length < 8) {
                status.textContent = "Your password must contain at least 8 characters.";
                status.style.color = "#fca5a5";
                return;
            }

            if (password !== confirmPassword) {
                status.textContent = "Passwords do not match.";
                status.style.color = "#fca5a5";
                return;
            }

            // Never include passwords in the displayed JSON.
            const submittedData = {
                username: username,
                email: email
            };

            document.getElementById("signupJson").textContent =
                JSON.stringify(submittedData, null, 2);

            status.textContent =
                "Form validated. No account has been created on a server.";
            status.style.color = "#86efac";
        });
    </script>
</body>
</html>
