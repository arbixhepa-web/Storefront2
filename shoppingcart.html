
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>GameZone - Shopping Cart</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <!-- jQuery -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <!-- Shopping Cart page developed by: YOUR NAME -->

    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 0 18px;
        }

        h1 {
            text-align: center;
            font-size: 28px;
            margin-bottom: 6px;
        }

        #productSelect {
            width: 100%;
        }

        #cartTable {
            margin-top: 10px;
        }

        #cartTable th,
        #cartTable td {
            vertical-align: middle;
            font-size: 12px;
        }

        .quantity {
            width: 100%;
            min-width: 80px;
        }

        #totalRow {
            text-align: right;
            font-size: 12px;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        #jsonOutput {
            font-size: 12px;
            white-space: pre-wrap;
            overflow-wrap: anywhere;
            margin-top: 8px;
        }

        #checkoutSection {
            margin-top: 12px;
        }
    </style>
</head>

<body>

    <h1>Shopping Cart</h1>

    <div class="mb-2">
        <select id="productSelect" class="form-select form-select-sm">
            <option value="001" data-name="Mens Jeans" data-price="59.99">
                Mens Jeans
            </option>
            <option value="004" data-name="Womens T-Shirt" data-price="19.99">
                Womens T-Shirt
            </option>
            <option value="002" data-name="Gaming Controller" data-price="39.99">
                Gaming Controller
            </option>
            <option value="003" data-name="Gaming Headset" data-price="59.99">
                Gaming Headset
            </option>
            <option value="005" data-name="Gaming Keyboard" data-price="69.99">
                Gaming Keyboard
            </option>
        </select>

        <button type="button" id="addButton"
                class="btn btn-primary btn-sm mt-1">
            Add
        </button>
    </div>

    <table id="cartTable" class="table table-sm">
        <thead>
            <tr>
                <th>Product ID</th>
                <th>Product Name</th>
                <th>Price</th>
                <th>Quantity</th>
                <th>Total</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="cartItems"></tbody>
    </table>

    <div id="totalRow">
        <strong>Total:</strong>
        &nbsp; $<span id="cartTotal">0.00</span>
    </div>

    <div id="checkoutSection">
        <button type="button" id="checkoutButton"
                class="btn btn-success btn-sm">
            Checkout
        </button>

        <pre id="jsonOutput"></pre>
    </div>

    <script>
        // Shopping Cart JavaScript developed by: YOUR NAME

        var cart = [];

        // Add a selected product to the cart.
        $("#addButton").on("click", function () {
            var selected = $("#productSelect option:selected");

            var productId = selected.val();
            var productName = selected.data("name");
            var price = Number(selected.data("price"));

            // Check whether the product is already in the cart.
            var existingProduct = cart.find(function (item) {
                return item.productId === productId;
            });

            if (existingProduct) {
                existingProduct.quantity++;
            } else {
                cart.push({
                    productId: productId,
                    productName: productName,
                    price: price,
                    quantity: 1,
                    total: price
                });
            }

            displayCart();
        });

        // Display cart products and calculate totals.
        function displayCart() {
            $("#cartItems").empty();

            var cartTotal = 0;

            cart.forEach(function (product, index) {
                product.total = product.price * product.quantity;
                cartTotal += product.total;

                var row = $("<tr></tr>");

                row.append($("<td></td>").text(product.productId));
                row.append($("<td></td>").text(product.productName));
                row.append($("<td></td>").text(
                    "$" + product.price.toFixed(2)
                ));

                var quantityInput = $("<input>")
                    .attr("type", "number")
                    .attr("min", "1")
                    .attr("step", "1")
                    .addClass("quantity")
                    .val(product.quantity);

                quantityInput.on("change", function () {
                    var quantity = Number($(this).val());

                    if (!Number.isInteger(quantity) || quantity < 1) {
                        quantity = 1;
                    }

                    product.quantity = quantity;
                    displayCart();
                });

                row.append($("<td></td>").append(quantityInput));

                row.append($("<td></td>").text(
                    "$" + product.total.toFixed(2)
                ));

                var removeButton = $("<button></button>")
                    .attr("type", "button")
                    .addClass("btn btn-danger btn-sm")
                    .text("Remove");

                removeButton.on("click", function () {
                    cart.splice(index, 1);
                    displayCart();
                });

                row.append($("<td></td>").append(removeButton));

                $("#cartItems").append(row);
            });

            $("#cartTotal").text(cartTotal.toFixed(2));
        }

        // Convert the cart into JSON when Checkout is clicked.
        $("#checkoutButton").on("click", function () {
            if (cart.length === 0) {
                $("#jsonOutput").text("Your shopping cart is empty.");
                return;
            }

            var orderJSON = JSON.stringify(cart, null, 2);

            $("#jsonOutput").text(orderJSON);
        });

        // Show the initial cart.
        displayCart();
    </script>

</body>
</html>
